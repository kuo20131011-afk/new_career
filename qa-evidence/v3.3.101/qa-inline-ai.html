<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Inline AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f3ff;color:#302064;padding:24px}.v400-ai-strip{display:block;background:linear-gradient(100deg,#eee7ff,#fff 56%,#f6f1ff);border:1px solid #e0d8f5;border-radius:22px;padding:22px 24px}.v397-ai-copy{display:flex;align-items:center;gap:16px;margin-bottom:18px}.v397-ai-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#5c36c7;color:#fff;font-weight:900}.v400-provider-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.v400-provider-option{min-height:46px;border:1px solid #ddd5f0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700}.v400-provider-option.active{background:#5c36c7;color:#fff}.v400-inline-config{margin-top:12px;padding:14px 16px;border:1px solid #d7c8f3;border-radius:14px;background:#fff}.v400-inline-fields{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px}.v400-inline-fields label{display:flex;flex-direction:column;gap:5px}.v400-inline-fields input{height:42px}.v400-save-btn{height:42px;background:#5c36c7;color:#fff;border:0;border-radius:10px;padding:0 16px}.v400-step5-row{margin-top:14px;background:linear-gradient(100deg,#eee7ff,#fff 56%,#f6f1ff);border:1px solid #e0d8f5;border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}.v400-step5-badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#5c36c7;color:#fff;font-size:27px;font-weight:900}.v400-step5-btn{height:52px;background:#5c36c7;color:#fff;border:0;border-radius:12px;padding:0 24px;font-weight:900}
</style></head><body>
<section class="v397-ai-strip v400-ai-strip" id="aiModelSection"><div class="v397-ai-copy"><div class="v397-ai-icon">4</div><div><h3>AI 智能分析・精準匹配</h3><p>透過履歷內容與職缺需求的深度分析，提供專業建議與優化方案。</p></div></div><div><div>✦ 選擇 AI 模型</div><div class="v400-provider-grid"><button class="v400-provider-option" data-provider="claude" onclick="selectInlineProvider('claude')">◉ Claude</button><button class="v400-provider-option" data-provider="gemini" onclick="selectInlineProvider('gemini')">✦ Gemini</button><button class="v400-provider-option" data-provider="chatgpt" onclick="selectInlineProvider('chatgpt')">◎ OpenAI</button><button class="v400-provider-option" data-provider="agnes" onclick="selectInlineProvider('agnes')">◈ Agnes</button><button class="v400-provider-option" data-provider="nvidia" onclick="selectInlineProvider('nvidia')">▣ NVIDIA NIM</button><button class="v400-provider-option" data-provider="groq" onclick="selectInlineProvider('groq')">◉ GroqCloud</button><button class="v400-provider-option" data-provider="openrouter" onclick="selectInlineProvider('openrouter')">◆ OpenRouter</button><button class="v400-provider-option" data-provider="mistral" onclick="selectInlineProvider('mistral')">▰ Mistral AI</button></div><div class="v400-inline-config" id="inlineAiConfig" hidden><strong id="inlineAiTitle"></strong><span id="inlineAiStatus"></span><div class="v400-inline-fields"><label>API Key<input id="inlineApiKey" type="password"></label><label>Model ID<input id="inlineApiModel"></label><button class="v400-save-btn" onclick="saveInlineAiConfig()">儲存並啟用</button></div></div></div></section>
<div class="v400-step5-row"><div class="v400-step5-badge">5</div><button class="v400-step5-btn" id="runAllBtn">✨ 一鍵產生履歷分析（媒合／健診／模擬面試）</button></div>
<script src="/js/api-keys.js"></script>
<script>window.addEventListener('load',()=>{selectInlineProvider('claude');});</script>
</body></html>
